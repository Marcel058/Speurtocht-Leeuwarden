<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Speurtocht Leeuwarden</title>

<style>
body {
    background-color: #0d1117;
    color: #00ff66;
    font-family: monospace;
    text-align: center;
    margin-top: 120px;
}

.box {
    border: 2px solid #00ff66;
    display: inline-block;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 20px #00ff66;
    background: rgba(0,0,0,0.8);
}

input {
    background: black;
    border: 1px solid #00ff66;
    color: #00ff66;
    padding: 10px;
    font-size: 16px;
}

button {
    background: #00ff66;
    color: black;
    border: none;
    padding: 10px 20px;
    margin-left: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.8;
}

#secret {
    display: none;
    margin-top: 25px;
    font-size: 22px;
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px #00ff66;
    }
    to {
        text-shadow: 0 0 20px #00ff66;
    }
}
</style>
</head>

<body>

<div class="box">
    <h1>🔐 ACCESS REQUIRED</h1>

    <p>Voer de geheime code in</p>

    <input type="password" id="pw">
    <button onclick="check()">UNLOCK</button>

    <div id="secret">
        🎉 Toegang verleend!<br><br>
        Volgende locatie:<br>
        Oldehove
    </div>
</div>

<script>
function check() {
    const code = "vodka ";
    const input = document.getElementById("pw").value;

    if(input === code) {
        document.getElementById("secret").style.display = "block";
    } else {
        alert("ACCESS DENIED");
    }
}
</script>

</body>
</html>
