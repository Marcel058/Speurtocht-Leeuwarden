<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Speurtocht Leeuwarden</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 120px;
    background: #f4f4f4;
}

.box {
    background: white;
    display: inline-block;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#secret {
    display: none;
    margin-top: 20px;
    font-size: 22px;
    color: green;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔐 Voer wachtwoord in</h2>

    <input type="password" id="pw" placeholder="wachtwoord">
    <button onclick="check()">OK</button>

    <div id="secret">
        🎉 Goed gedaan! Nog één laatste stop:
            51.5147° N, 7.6131° E 
        Ga hiernaar toe en je weekend kan dan echt beginnen.
    </div>
</div>

<script>
function check() {
    const code = "VODKA"; // <-- dit is je wachtwoord
    const input = document.getElementById("pw").value;

    if (input === code) {
        document.getElementById("secret").style.display = "block";
    } else {
        alert("Fout wachtwoord!");
    }
}
</script>

</body>
</html>
