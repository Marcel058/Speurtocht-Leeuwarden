<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCESS TERMINAL</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Courier New, monospace;
    color:#00ff00;
}

/* MATRIX ACHTERGROND */

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

/* FULLSCREEN POPUP */

#popup{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

/* HACKER BOX */

.box{
    width:90%;
    max-width:750px;

    background:rgba(0,0,0,0.92);

    border:2px solid #00ff00;

    border-radius:12px;

    padding:40px;

    text-align:center;

    box-shadow:0 0 30px #00ff00;
}

/* TITEL */

h1{
    text-shadow:0 0 15px #00ff00;
}

/* TERMINAL TYPING */

#typing{
    min-height:30px;
    margin-bottom:25px;
    font-size:18px;
}

/* INPUT */

input{
    background:black;
    border:1px solid #00ff00;
    color:#00ff00;
    padding:12px;
    width:60%;
    font-size:18px;
    font-family:monospace;
}

/* BUTTON */

button{
    background:#00ff00;
    color:black;
    border:none;
    padding:12px 24px;
    margin-left:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 15px #00ff00;
}

/* DECRYPTING */

#decrypting{
    display:none;
    margin-top:30px;
    font-size:24px;
    animation:blink 1s infinite;
}

/* SECRET */

#secret{
    display:none;
    margin-top:30px;
}

/* COUNTDOWN */

#countdown{
    font-size:55px;
    margin-top:20px;
    text-shadow:0 0 20px #00ff00;
}

/* FOTO */

#bewijsfoto{

    width:350px;

    margin-top:25px;

    border:3px solid #00ff00;

    border-radius:12px;

    box-shadow:0 0 30px #00ff00;

    opacity:0;

    filter:blur(25px);

    transform:scale(0.9);

    transition:all 4s ease;
}

/* GLOW */

.glow{
    text-shadow:0 0 15px #00ff00;
}

/* BLINK */

@keyframes blink{
    50%{
        opacity:0;
    }
}

</style>

</head>

<body>

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- POPUP -->
<div id="popup">

<div class="box">

<h1>🔐 ACCESS TERMINAL</h1>

<div id="typing"></div>

<input type="password"
       id="pw"
       placeholder="ENTER PASSWORD">

<button onclick="checkPassword()">
UNLOCK
</button>

<div id="decrypting">
DECRYPTING FILES...
</div>

<!-- GEHEIME CONTENT -->
<div id="secret">

<h2 class="glow">
🎉 ACCESS GRANTED
</h2>

<div id="countdown"></div>

<p id="decryptText" class="glow">
DECRYPTING IMAGE FILE...
</p>    
<img id="bewijsfoto"
     src="foto.jpg">
    
<p class="glow">

Nog één laatste stop:<br><br>

51.5147° N, 7.6131° E

</p>

<div id="countdown"></div>

<p id="decryptText" class="glow">
DECRYPTING IMAGE FILE...
</p>

<img id="bewijsfoto"
     src="foto.jpg">
</div>

</div>

</div>

<!-- GELUID -->
<audio id="hackSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
type="audio/mpeg">
</audio>

<script>

/* MATRIX EFFECT */

const canvas =
    document.getElementById('matrix');

const ctx =
    canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters =
    '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';

const fontSize = 16;

const columns =
    canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){

    drops[x] = 1;
}

function drawMatrix(){

    ctx.fillStyle =
        'rgba(0,0,0,0.05)';

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = '#00ff00';

    ctx.font =
        fontSize + 'px monospace';

    for(let i = 0; i < drops.length; i++){

        const text =
            letters.charAt(
                Math.floor(
                    Math.random()
                    * letters.length
                )
            );

        ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
        );

        if(
            drops[i] * fontSize
            > canvas.height
            &&
            Math.random() > 0.975
        ){
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 35);

/* TERMINAL TYPING */

const text =
'INITIALIZING SECURE CONNECTION...';

const typing =
    document.getElementById('typing');

let i = 0;

function typeWriter(){

    if(i < text.length){

        typing.innerHTML +=
            text.charAt(i);

        i++;

        setTimeout(typeWriter, 60);
    }
}

typeWriter();

/* PASSWORD CHECK */

function checkPassword(){

    const password =
        document.getElementById('pw').value;

    if(password === 'vodka'){

        document.getElementById(
            'hackSound'
        ).play();

        const decrypt =
            document.getElementById(
                'decrypting'
            );

        decrypt.style.display = 'block';

        setTimeout(() => {

            decrypt.style.display = 'none';

            document.getElementById(
                'secret'
            ).style.display = 'block';

            startCountdown();

        }, 2000);

    } else {

        alert('ACCESS DENIED');
    }
}

/* COUNTDOWN */

function startCountdown(){

    let count = 5;

    const countdown =
        document.getElementById(
            'countdown'
        );

    countdown.innerHTML = count;

    const interval =
        setInterval(() => {

        count--;

        if(count > 0){

            countdown.innerHTML =
                count;

        } else {

            clearInterval(interval);

            countdown.innerHTML =
                'IMAGE DECRYPTED';

            revealImage();
        }

    }, 1000);
}

/* FOTO REVEAL */

function revealImage(){

    const img =
        document.getElementById(
            'bewijsfoto'
        );

    img.style.opacity = '1';

    img.style.filter = 'blur(0px)';

    img.style.transform = 'scale(1)';
}

</script>

</body>
</html>
