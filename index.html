<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS TERMINAL</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Courier New, monospace;
    color:#00ff00;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

#popup{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

.box{
    width:90%;
    max-width:700px;
    background:rgba(0,0,0,0.9);
    border:2px solid #00ff00;
    border-radius:12px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px #00ff00;
}

h1{
    text-shadow:0 0 10px #00ff00;
}

#typing{
    min-height:30px;
    margin-bottom:20px;
}

input{
    background:black;
    border:1px solid #00ff00;
    color:#00ff00;
    padding:12px;
    width:60%;
    font-size:18px;
}

button{
    background:#00ff00;
    color:black;
    border:none;
    padding:12px 24px;
    font-weight:bold;
    cursor:pointer;
}

#decrypting{
    display:none;
    margin-top:30px;
    font-size:24px;
}

#secret{
    display:none;
    margin-top:30px;
    font-size:28px;
    line-height:1.5;
    text-shadow:0 0 15px #00ff00;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="popup">

<div class="box">

<h1>🔐 ACCESS TERMINAL</h1>

<div id="typing"></div>

<input type="password" id="pw" placeholder="ENTER PASSWORD">
<button onclick="checkPassword()">UNLOCK</button>

<div id="decrypting">
DECRYPTING FILES<span class="blink">...</span>
</div>

<div id="secret">

ACCESS GRANTED<br><br>
    
<img src="foto.jpg"
     width="300"
     style="
        border:2px solid #00ff00;
        border-radius:10px;
        box-shadow:0 0 20px #00ff00;
        margin-top:20px;
     ">
    
Nog één laatste stop:<br><br>

51.5147° N, 7.6131° E

</div>

</div>

</div>

<audio id="hackSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<script>

/* MATRIX EFFECT */

const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
    drops[x] = 1;
}

function drawMatrix(){

    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = '#00ff00';
    ctx.font = fontSize + 'px monospace';

    for(let i = 0; i < drops.length; i++){

        const text = letters.charAt(
            Math.floor(Math.random() * letters.length)
        );

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 35);

/* TERMINAL TYPING */

const text = 'INITIALIZING SECURE CONNECTION...';
const typing = document.getElementById('typing');

let i = 0;

function typeWriter(){

    if(i < text.length){

        typing.innerHTML += text.charAt(i);

        i++;

        setTimeout(typeWriter, 60);
    }
}

typeWriter();

/* PASSWORD CHECK */

function checkPassword(){

    const password = document.getElementById('pw').value;

    if(password === 'vodka'){

        document.getElementById('hackSound').play();

        const decrypt =
            document.getElementById('decrypting');

        decrypt.style.display = 'block';

        setTimeout(() => {

            decrypt.style.display = 'none';

            document.getElementById('secret')
                .style.display = 'block';

        }, 3000);

    } else {

        alert('ABE = DOOD');

    }
}

</script>

</body>
</html>
