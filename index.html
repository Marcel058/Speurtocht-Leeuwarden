<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS TERMINAL</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Courier New, monospace;
    color:#00ff00;
}

/* MATRIX */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

/* POPUP */
#popup{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

.box{
    width:90%;
    max-width:750px;
    background:rgba(0,0,0,0.92);
    border:2px solid #00ff00;
    border-radius:12px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px #00ff00;
}

h1{
    text-shadow:0 0 15px #00ff00;
}

#typing{
    min-height:30px;
    margin-bottom:25px;
}

input{
    background:black;
    border:1px solid #00ff00;
    color:#00ff00;
    padding:12px;
    width:60%;
    font-size:18px;
}

button{
    background:#00ff00;
    color:black;
    border:none;
    padding:12px 24px;
    margin-left:10px;
    cursor:pointer;
    font-weight:bold;
}

#decrypting{
    display:none;
    margin-top:20px;
    font-size:22px;
}

#secret{
    display:none;
    margin-top:20px;
}

#countdown{
    font-size:50px;
    margin-top:10px;
}

/* IMAGE REVEAL */
#bewijsfoto{
    width:300px;
    margin-top:20px;
    border:3px solid #00ff00;
    border-radius:10px;
    opacity:0;
    filter:blur(20px);
    transform:scale(0.9);
    transition:all 3s ease;
}

/* FAIL */
#errorGif, #virus{
    display:none;
    margin-top:15px;
}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="popup">

<div class="box">

<h1>🔐 ACCESS TERMINAL</h1>

<div id="typing"></div>

<input type="password" id="pw" placeholder="ENTER PASSWORD">
<button onclick="checkPassword()">UNLOCK</button>

<div id="decrypting">DECRYPTING FILES...</div>

<div id="secret">

<h2>ACCESS GRANTED</h2>

<div id="countdown"></div>

<img id="bewijsfoto" src="foto.jpg">

<p>51.5147° N, 7.6131° E</p>

</div>

<!-- FAIL STATE -->
<div id="errorGif">
    <img src="https://media1.tenor.com/m/HXHCV0LpqNAAAAAC/hilarious-so-funny.gif" width="220">
    <div style="margin-top:10px;">ACCESS DENIED</div>
</div>

<div id="virus">
SYSTEM COMPROMISED <br>
</div>

</div>

</div>

<audio id="hackSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3">
</audio>

<script>

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix(){

    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff00";
    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){

        const text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }
}
setInterval(drawMatrix,35);

/* TYPE EFFECT */
const text="INITIALIZING SECURE CONNECTION...";
let i=0;
const typing=document.getElementById("typing");

function typeWriter(){
    if(i<text.length){
        typing.innerHTML+=text[i];
        i++;
        setTimeout(typeWriter,60);
    }
}
typeWriter();

/* PASSWORD CHECK */
function checkPassword(){

const pw=document.getElementById("pw").value;

if(pw==="VODKA"){

    document.getElementById("hackSound").play();

    document.getElementById("decrypting").style.display="block";

    setTimeout(()=>{

        document.getElementById("decrypting").style.display="none";
        document.getElementById("secret").style.display="block";

        startCountdown();

    },2000);

} else {

    document.getElementById("errorGif").style.display="block";
    document.getElementById("virus").style.display="block";

    setTimeout(()=>{

        document.getElementById("errorGif").style.display="none";
        document.getElementById("virus").style.display="none";
        document.getElementById("pw").value="";

    },3000);
}

}

/* COUNTDOWN */
function startCountdown(){

let count=5;
const cd=document.getElementById("countdown");
cd.innerHTML=count;

const interval=setInterval(()=>{

    count--;

    if(count>0){
        cd.innerHTML=count;
    } else {
        clearInterval(interval);
        cd.innerHTML="IMAGE DECRYPTED";
        revealImage();
    }

},1000);

}

/* IMAGE REVEAL */
function revealImage(){

const img=document.getElementById("bewijsfoto");

img.style.opacity="1";
img.style.filter="blur(0px)";
img.style.transform="scale(1)";

}

</script>

</body>
</html>
